<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loadstring - Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family:'Inter',sans-serif; background:linear-gradient(270deg,#f953c6,#b91d73,#4facfe,#00f2fe); background-size:800% 800%; animation:gradientBG 25s ease infinite; color:white; display:flex; flex-direction:column; align-items:center; padding:30px;}
@keyframes gradientBG {0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1 { font-size:2.5rem; margin-bottom:20px; text-shadow:2px 2px 12px #000;}
input { width:90%; padding:12px; border-radius:20px; font-family:monospace; font-size:16px; background-color:#111; color:#00ff99; border:3px solid #ff6ec4; box-shadow:0 5px 15px rgba(0,0,0,0.5); margin-bottom:15px;}
button { padding:15px 30px; border-radius:20px; font-weight:bold; font-size:18px; background:linear-gradient(135deg,#ff6ec4,#7873f5); color:white; cursor:pointer; transition:0.3s; box-shadow:0 5px 15px rgba(0,0,0,0.5);}
button:hover { transform:scale(1.1) rotate(-2deg); box-shadow:0 10px 25px rgba(0,0,0,0.7);}
#resultado { margin-top:20px; width:90%; min-height:80px; padding:15px; border-radius:20px; background-color:#111; color:#00ff99; font-family:monospace; white-space:pre-wrap; box-shadow:0 5px 15px rgba(0,0,0,0.5);}
</style>
</head>
<body>

<h1>Loadstring</h1>
<input id="urlInput" placeholder="Digite a URL do script">
<button id="gerarBtn">Gerar Loadstring</button>
<div id="resultado">Aqui aparecerá o loadstring gerado.</div>

<script>
document.getElementById('gerarBtn').addEventListener('click', function(){
  const url = document.getElementById('urlInput').value.trim();
  if(!url){ alert('Digite uma URL!'); return; }
  document.getElementById('resultado').textContent = `loadstring(game:HttpGet("${url}"))()`;
});
</script>

</body>
</html>
