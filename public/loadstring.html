<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loadstring | Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {font-family:'Inter',sans-serif; background:#111; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
input {width:80%; margin:10px 0; padding:10px; border-radius:10px; border:none; background:rgba(255,255,255,0.1); color:#fff;}
button {padding:10px 20px; border-radius:10px; background:linear-gradient(135deg,#ff6ec4,#7873f5); cursor:pointer; color:#fff; font-weight:bold; margin-top:10px;}
button:hover{transform:scale(1.05);}
#resultado{margin-top:20px;font-family:monospace;color:#fff;}
</style>
</head>
<body>

<h1>Gerar Loadstring</h1>
<input type="text" id="urlInput" placeholder="Cole a URL do Script">
<button id="gerarBtn">Gerar Loadstring</button>
<div id="resultado"></div>

<script>
document.getElementById('gerarBtn').addEventListener('click',()=>{
  const url=document.getElementById('urlInput').value.trim();
  if(!url){alert('Digite uma URL'); return;}
  document.getElementById('resultado').innerText=`loadstring(game:HttpGet("${url}"))()`;
});
</script>

</body>
</html>
