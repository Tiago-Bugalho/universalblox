<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loadstring | Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {font-family:'Inter',sans-serif; background:#111; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
input {width:80%; padding:12px; margin:8px 0; border-radius:12px; border:none; background:rgba(255,255,255,0.1); color:#fff; font-size:16px;}
button {padding:12px 25px; border-radius:12px; background:linear-gradient(135deg,#ff6ec4,#7873f5); font-weight:bold; color:#fff; cursor:pointer; font-size:16px; transition:0.3s;}
button:hover {transform:scale(1.05);}
#resultado{margin-top:20px; font-family:monospace; color:#fff;}
</style>
</head>
<body>

<h1>Gerar Loadstring</h1>
<input type="text" id="urlInput" placeholder="Cole a URL do script aqui">
<button id="gerarBtn">Gerar Loadstring</button>
<div id="resultado"></div>

<script>
document.getElementById('gerarBtn').addEventListener('click', ()=>{
  const url = document.getElementById('urlInput').value.trim();
  if(!url){ alert('Digite a URL!'); return; }

  const loadstringText = `loadstring(game:HttpGet("${url}"))()`;
  document.getElementById('resultado').textContent = loadstringText;
});
</script>

</body>
</html>
