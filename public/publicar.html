<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicar Script - Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family:'Inter',sans-serif; background:linear-gradient(270deg,#ff512f,#dd2476,#24c6dc,#514a9d); background-size:800% 800%; animation:gradientBG 25s ease infinite; color:white; display:flex; flex-direction:column; align-items:center; padding:30px;}
@keyframes gradientBG {0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1 { font-size:2.5rem; margin-bottom:20px; text-shadow:2px 2px 12px #000;}
input,textarea,select { width:90%; padding:12px; margin-bottom:15px; border-radius:20px; font-family:monospace; font-size:16px; background-color:#111; color:#00ff99; border:3px solid #ff6ec4; box-shadow:0 5px 15px rgba(0,0,0,0.5);}
button { padding:15px 30px; border-radius:20px; font-weight:bold; font-size:18px; background:linear-gradient(135deg,#ff6ec4,#7873f5); color:white; cursor:pointer; transition:0.3s; box-shadow:0 5px 15px rgba(0,0,0,0.5);}
button:hover { transform:scale(1.1) rotate(-2deg); box-shadow:0 10px 25px rgba(0,0,0,0.7);}
</style>
</head>
<body>

<h1>Publicar Script</h1>

<form id="publicarForm">
  <textarea id="loadstring" placeholder='Loadstring: loadstring(game:HttpGet("URL"))()' required></textarea>
  <input type="text" id="nome" placeholder="Nome do Script" required>
  <select id="jogo">
    <option value="Universal">Universal</option>
    <option value="Outro">Outro</option>
  </select>
  <input type="text" id="nomeOutroJogo" placeholder="Nome do Jogo" style="display:none; margin-top:10px;">
  <textarea id="descricao" placeholder="Descrição do Script"></textarea>
  <button type="submit">Publicar</button>
</form>

<script>
const scriptsDB = JSON.parse(localStorage.getItem('scriptsDB') || '[]');
const selectJogo = document.getElementById('jogo');
const inputOutro = document.getElementById('nomeOutroJogo');

selectJogo.addEventListener('change', function(){ inputOutro.style.display = this.value==='Outro'?'block':'none'; });

document.getElementById('publicarForm').addEventListener('submit', function(e){
  e.preventDefault();
  const loadstring = document.getElementById('loadstring').value.trim();
  const nome = document.getElementById('nome').value.trim();
  let jogo = selectJogo.value;
  if(jogo==='Outro'){ jogo = inputOutro.value.trim(); if(!jogo){ alert('Digite o nome do jogo!'); return; } }
  const descricao = document.getElementById('descricao').value.trim();

  for(let i=scriptsDB.length-1;i>=0;i--){
    if(scriptsDB[i].content && !scriptsDB[i].nome){
      scriptsDB[i].nome = nome;
      scriptsDB[i].jogo = jogo;
      scriptsDB[i].descricao = descricao;
      scriptsDB[i].loadstring = loadstring;
      break;
    }
  }
  localStorage.setItem('scriptsDB', JSON.stringify(scriptsDB));
  alert(`Script "${nome}" publicado com sucesso!`);
  window.location.href='index.html';
});
</script>

</body>
</html>
