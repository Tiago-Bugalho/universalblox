<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicar Script | Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {font-family:'Inter',sans-serif; background:#1a1a1a; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
input, textarea, select {width:80%; margin:10px 0; padding:10px; border-radius:10px; border:none; background:rgba(255,255,255,0.1); color:#fff;}
button {padding:10px 20px; border-radius:10px; background:linear-gradient(135deg,#ff6ec4,#7873f5); cursor:pointer; color:#fff; font-weight:bold; margin-top:10px;}
button:hover{transform:scale(1.05);}
</style>
</head>
<body>

<h1>Publicar Script</h1>
<input type="text" id="nome" placeholder="Nome do Script">
<select id="jogo">
  <option value="Universal">Universal</option>
  <option value="Roblox">Roblox</option>
</select>
<textarea id="descricao" placeholder="Descrição do Script" rows="4"></textarea>
<textarea id="content" placeholder="Conteúdo do Script" rows="6"></textarea>
<button id="publicarBtn">Publicar</button>

<script>
async function publicarScript(nome, jogo, descricao, content){
  const res = await fetch('/api/publicar', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nome,jogo,descricao,content})
  });
  return res.json();
}

document.getElementById('publicarBtn').addEventListener('click',async()=>{
  const nome=document.getElementById('nome').value.trim();
  const jogo=document.getElementById('jogo').value;
  const descricao=document.getElementById('descricao').value.trim();
  const content=document.getElementById('content').value.trim();
  if(!nome||!content){alert('Nome e conteúdo obrigatórios'); return;}
  try{
    const data=await publicarScript(nome,jogo,descricao,content);
    alert(`Script publicado! ID: ${data.id}`);
    window.location.href='index.html';
  }catch(e){console.error(e); alert('Erro ao publicar');}
});
</script>

</body>
</html>
