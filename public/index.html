<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(270deg, #ff6ec4, #7873f5, #42e695, #fcd440);
  background-size: 800% 800%;
  animation: gradientBG 25s ease infinite;
  color: white;
  text-align: center;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 20px;
}
@keyframes gradientBG {
  0% {background-position:0% 50%}
  50% {background-position:100% 50%}
  100% {background-position:0% 50%}
}
h1 {
  font-size: 3rem;
  margin-bottom: 10px;
  text-shadow: 2px 2px 12px #000;
}
p {
  font-size: 1.2rem;
  margin-bottom: 40px;
  text-shadow: 1px 1px 8px #000;
}
.button-group {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}
button {
  padding: 20px 40px;
  border-radius: 20px;
  background: linear-gradient(135deg, #ff6ec4, #7873f5);
  font-weight: bold;
  color: white;
  cursor: pointer;
  font-size: 18px;
  transition: 0.3s;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}
button:hover {
  transform: scale(1.1) rotate(-2deg);
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
}
</style>
</head>
<body>

<h1>Universal Blox</h1>
<p>Bem-vindo ao site de scripts Roblox</p>

<div class="button-group">
  <button onclick="window.location.href='public/raw.html'">Raw</button>
  <button onclick="window.location.href='public/publicar.html'">Publicar</button>
  <button onclick="window.location.href='public/loadstring.html'">Loadstring</button>
  <button onclick="window.location.href='public/pesquisa.html'">Pesquisar</button>
</div>

</body>
</html>
