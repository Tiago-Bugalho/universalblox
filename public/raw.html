<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raw Script</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(270deg, #ff6ec4, #7873f5, #42e695, #fcd440);
  background-size: 800% 800%;
  animation: gradientBG 25s ease infinite;
  color: white;
  text-align: center;
  padding: 20px;
}
@keyframes gradientBG {
  0% {background-position:0% 50%}
  50% {background-position:100% 50%}
  100% {background-position:0% 50%}
}
textarea {
  width: 80%;
  min-height: 200px;
  padding: 15px;
  border-radius: 15px;
  border: none;
  font-family: monospace;
  font-size: 16px;
  margin-bottom: 20px;
}
button {
  padding: 15px 30px;
  border-radius: 15px;
  background: linear-gradient(135deg, #ff6ec4, #7873f5);
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
}
button:hover {
  transform: scale(1.05);
}
#resultado {
  margin-top: 20px;
  font-family: monospace;
  font-size: 16px;
}
</style>
</head>
<body>

<h1 class="text-3xl mb-6">Raw Script</h1>
<textarea id="scriptInput" placeholder="Digite seu script aqui..."></textarea>
<br>
<button id="botaoPublicar">Gerar Script</button>
<div id="resultado"></div>

<script src="scripts.js"></script>
<script>
document.getElementById('botaoPublicar').addEventListener('click', async ()=>{
  const script = document.getElementById('scriptInput').value.trim();
  if(!script){ alert('Digite algo!'); return; }
  
  // Publica o script
  const data = await publicarScript(script, "Sem Nome", "Universal", "");
  document.getElementById('resultado').innerHTML = `
    Script ID: <strong>${data.id}</strong><br>
    <a href="${data.url}" target="_blank">Abrir Script ${data.id}</a>
  `;
});
</script>

</body>
</html>
