<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raw Script | Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {font-family:'Inter',sans-serif; background:#111; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
textarea {width:80%; min-height:200px; padding:15px; border-radius:15px; border:none; font-family:monospace; font-size:16px; margin-bottom:20px; background:rgba(0,0,0,0.6); color:#fff;}
button {padding:15px 30px; border-radius:15px; background:linear-gradient(135deg,#ff6ec4,#7873f5); font-weight:bold; color:#fff; cursor:pointer; font-size:16px; transition:0.3s;}
button:hover {transform:scale(1.05);}
#resultado{margin-top:20px; font-family:monospace; color:#fff;}
</style>
</head>
<body>

<h1>Raw Script</h1>
<textarea id="scriptInput" placeholder="Digite seu script aqui..."></textarea>
<br>
<button id="botaoPublicar">Gerar Script</button>
<div id="resultado"></div>

<script>
async function publicarScript(content, nome="Sem Nome", jogo="Universal", descricao="") {
  const res = await fetch('/api/publicar', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({content, nome, jogo, descricao})
  });
  return res.json();
}

document.getElementById('botaoPublicar').addEventListener('click', async ()=>{
  const script = document.getElementById('scriptInput').value.trim();
  if(!script){ alert('Digite algo!'); return; }

  try {
    const data = await publicarScript(script);
    document.getElementById('resultado').innerHTML = `
      Script ID: <strong>${data.id}</strong><br>
      <a href="/api/abrir?id=${data.id}" target="_blank" style="color:#fff;text-decoration:underline;">
        Abrir Script ${data.id}
      </a>
    `;
  } catch(err) {
    console.error(err);
    alert('Erro ao publicar o script.');
  }
});
</script>

</body>
</html>
