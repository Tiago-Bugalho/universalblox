<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisar Scripts - Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family:'Inter',sans-serif; background:linear-gradient(270deg,#f7971e,#ffd200,#34e89e,#0f3443); background-size:800% 800%; animation:gradientBG 25s ease infinite; color:white; display:flex; flex-direction:column; align-items:center; padding:30px;}
@keyframes gradientBG {0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1 { font-size:2.5rem; margin-bottom:20px; text-shadow:2px 2px 12px #000;}
input { width:90%; padding:12px; border-radius:20px; font-family:monospace; font-size:16px; background-color:#111; color:#00ff99; border:3px solid #ff6ec4; box-shadow:0 5px 15px rgba(0,0,0,0.5); margin-bottom:15px;}
button { padding:12px 25px; border-radius:20px; font-weight:bold; font-size:16px; background:linear-gradient(135deg,#ff6ec4,#7873f5); color:white; cursor:pointer; transition:0.3s; box-shadow:0 5px 15px rgba(0,0,0,0.5);}
button:hover { transform:scale(1.05) rotate(-1deg); box-shadow:0 10px 25px rgba(0,0,0,0.7);}
.card { background-color:#111; border-radius:20px; padding:15px; width:90%; margin-bottom:15px; box-shadow:0 5px 15px rgba(0,0,0,0.5);}
.card a { color:#00ff99; font-weight:bold; text-decoration:none;}
.card a:hover { text-decoration:underline;}
</style>
</head>
<body>

<h1>Pesquisar Scripts</h1>
<input id="searchInput" placeholder="Digite o nome do script ou jogo">
<button id="searchBtn">Pesquisar</button>
<div id="results"></div>

<script>
const scriptsDB = JSON.parse(localStorage.getItem('scriptsDB') || '[]');

document.getElementById('searchBtn').addEventListener('click', function(){
  const termo = document.getElementById('searchInput').value.toLowerCase();
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  const encontrados = scriptsDB.filter(s => s.nome.toLowerCase().includes(termo) || s.jogo.toLowerCase().includes(termo));
  if(encontrados.length===0){ resultsDiv.textContent='Nenhum script encontrado.'; return; }
  encontrados.forEach(s => {
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<strong>${s.nome}</strong> [${s.jogo}]<br>${s.descricao}<br>Loadstring:<br><code>${s.loadstring || ''}</code><br>ID: ${s.id}`;
    resultsDiv.appendChild(card);
  });
});
</script>

</body>
</html>
