<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisar Scripts | Universal Blox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {font-family:'Inter',sans-serif; background:#222; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px;}
input {width:80%; padding:12px; margin:8px 0; border-radius:12px; border:none; background:rgba(255,255,255,0.1); color:#fff; font-size:16px;}
button {padding:12px 25px; border-radius:12px; background:linear-gradient(135deg,#ff6ec4,#7873f5); font-weight:bold; color:#fff; cursor:pointer; font-size:16px; transition:0.3s;}
button:hover {transform:scale(1.05);}
#resultados{margin-top:20px; width:80%;}
.result{background:rgba(255,255,255,0.1); padding:12px; margin:6px 0; border-radius:12px;}
.result a{color:#fff; text-decoration:underline;}
</style>
</head>
<body>

<h1>Pesquisar Scripts</h1>
<input type="text" id="pesquisaInput" placeholder="Nome do Script">
<button id="pesquisarBtn">Pesquisar</button>
<div id="resultados"></div>

<script>
async function pesquisar(nome){
  const res = await fetch(`/api/pesquisar?nome=${encodeURIComponent(nome)}`);
  return res.json();
}

document.getElementById('pesquisarBtn').addEventListener('click', async ()=>{
  const termo = document.getElementById('pesquisaInput').value.trim();
  if(!termo){ alert('Digite algo'); return; }

  const data = await pesquisar(termo);
  const resultadosDiv = document.getElementById('resultados');
  resultadosDiv.innerHTML = '';

  data.forEach(s => {
    const div = document.createElement('div');
    div.className = 'result';
    div.innerHTML = `
      <strong>${s.nome}</strong> (${s.jogo})<br>
      ${s.descricao}<br>
      <a href="/api/abrir?id=${s.id}" target="_blank">Abrir Script</a><br>
      Loadstring: <code>${s.loadstring}</code>
    `;
    resultadosDiv.appendChild(div);
  });
});
</script>

</body>
</html>
